name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm-install
      - uses: ./.github/actions/fixtures
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test

  e2e:
    # The 5,000-photo benchmarks take as long as everything else together: their own job runs
    # them alongside the rest, on macOS only.
    name: ${{ matrix.suite == 'perf' && 'Perf' || 'E2E' }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        suite: [e2e, perf]
        # One platform is enough to catch a regression; Windows runners take twice as long.
        exclude:
          - os: windows-latest
            suite: perf
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm-install
      - uses: ./.github/actions/fixtures
      - name: Build
        run: pnpm build
      - name: Package (unpacked dir)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            pnpm package:mac:dir
          else
            pnpm exec electron-builder --win --x64 --dir --publish never
          fi
      - name: Packaged smoke (bundled ExifTool)
        if: matrix.suite == 'e2e'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            APP="dist/mac-arm64/Stecknadel.app/Contents/MacOS/Stecknadel"
          else
            APP="dist/win-unpacked/Stecknadel.exe"
          fi
          cp test/fixtures/generated/smoke.jpg "$RUNNER_TEMP/steck-smoke.jpg"
          STECKNADEL_SMOKE_FILE="$RUNNER_TEMP/steck-smoke.jpg" "$APP" > smoke.log 2>&1 || true
          grep STECKNADEL_SMOKE smoke.log || { cat smoke.log; exit 1; }
          grep -q "^STECKNADEL_SMOKE ok " smoke.log
      - name: Native ExifTool tests
        if: matrix.suite == 'e2e'
        run: pnpm test:native
      - name: Playwright (packaged app)
        run: |
          if [ "${{ matrix.suite }}" = "perf" ]; then
            # macos-latest has 3 vCPUs (2 ExifTool processes): 5.7 s here vs 0.8 s on a 12-core Mac.
            STECKNADEL_PERF_SHARED_RUNNER=1 pnpm exec playwright test --project=packaged-dir --grep @perf
          else
            pnpm exec playwright test --project=packaged-dir --grep-invert @perf
          fi
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.suite }}-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
